name: release

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package or plugin to release"
        required: true
        type: choice
        options:
          - opencode-mmcp-1file
          - codex-mmcp-1file
      version:
        description: "Target version, for example 0.4.0"
        required: true
        type: string
      dry_run:
        description: "Run publish/release checks without pushing tags or releases"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  opencode-npm:
    if: ${{ inputs.package == 'opencode-mmcp-1file' }}
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: ${{ inputs.package }}
      TARGET_VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Set selected workspace version
        run: npm version "$TARGET_VERSION" --workspace "$PACKAGE_NAME" --no-git-tag-version

      - run: npm run build --workspaces

      - run: npm run test --workspaces

      - run: npm run bundle:core

      - run: npm run verify:packages

      - run: npm pack --workspace opencode-mmcp-1file --dry-run

      - name: Publish selected workspace
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --workspace "$PACKAGE_NAME" --dry-run
          else
            npm publish --workspace "$PACKAGE_NAME"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit release version
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json packages/opencode-plugin/package.json
          git commit -m "release: ${PACKAGE_NAME}@${TARGET_VERSION}"

      - name: Tag release
        if: ${{ !inputs.dry_run }}
        run: git tag "${PACKAGE_NAME}@${TARGET_VERSION}"

      - name: Push release commit and tag
        if: ${{ !inputs.dry_run }}
        run: |
          git push
          git push origin "${PACKAGE_NAME}@${TARGET_VERSION}"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        run: gh release create "${PACKAGE_NAME}@${TARGET_VERSION}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codex-plugin:
    if: ${{ inputs.package == 'codex-mmcp-1file' }}
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: ${{ inputs.package }}
      TARGET_VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
      RUNTIME_BRANCH: codex-mmcp-1file-runtime
      RUNTIME_ROOT: dist/codex-runtime
      RUNTIME_PLUGIN_DIR: dist/codex-runtime/codex-mmcp-1file
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Set Codex plugin version and marketplace ref
        run: |
          npm version "$TARGET_VERSION" --workspace "$PACKAGE_NAME" --no-git-tag-version --allow-same-version
          node -e '
            const fs = require("node:fs");
            const version = process.env.TARGET_VERSION;
            const tag = `${process.env.PACKAGE_NAME}@${version}`;

            const manifestPath = "packages/codex-plugin/.codex-plugin/plugin.json";
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            manifest.version = version;
            fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);

            const marketplacePath = ".codex-plugin/marketplace.json";
            const marketplace = JSON.parse(fs.readFileSync(marketplacePath, "utf8"));
            const plugin = marketplace.plugins.find((entry) => entry.name === process.env.PACKAGE_NAME);
            if (!plugin) throw new Error(`Missing ${process.env.PACKAGE_NAME} marketplace entry`);
            plugin.source.path = "./codex-mmcp-1file";
            plugin.source.ref = tag;
            fs.writeFileSync(marketplacePath, `${JSON.stringify(marketplace, null, 2)}\n`);
          '

      - run: npm run build --workspaces

      - run: npm run test --workspaces

      - run: CODEX_MARKETPLACE_REF="${PACKAGE_NAME}@${TARGET_VERSION}" npm run verify:packages

      - name: Pack Codex runtime archive
        run: |
          mkdir -p dist/releases
          tar -czf "dist/releases/${PACKAGE_NAME}-${TARGET_VERSION}.tgz" -C "$RUNTIME_ROOT" codex-mmcp-1file
          (cd "$RUNTIME_ROOT" && zip -qry "../releases/${PACKAGE_NAME}-${TARGET_VERSION}.zip" codex-mmcp-1file)

      - name: Commit release metadata
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json packages/codex-plugin/package.json packages/codex-plugin/.codex-plugin/plugin.json .codex-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "Release metadata already up to date; skipping commit."
          else
            git commit -m "release: ${PACKAGE_NAME}@${TARGET_VERSION}"
            git push
          fi

      - name: Prepare runtime branch worktree
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$RUNTIME_BRANCH" || true
          git worktree add --detach ../codex-runtime-branch
          cd ../codex-runtime-branch
          git rm -r . || true
          cp -R "$GITHUB_WORKSPACE/$RUNTIME_PLUGIN_DIR" ./codex-mmcp-1file
          git add -f codex-mmcp-1file
          git commit -m "release: ${PACKAGE_NAME}@${TARGET_VERSION} runtime"
          git branch -f "$RUNTIME_BRANCH"
          git tag "${PACKAGE_NAME}@${TARGET_VERSION}"
          REMOTE_RUNTIME_SHA="$(git ls-remote --heads origin "$RUNTIME_BRANCH" | cut -f1)"
          if [ -n "$REMOTE_RUNTIME_SHA" ]; then
            git push origin HEAD:"refs/heads/$RUNTIME_BRANCH" --force-with-lease="refs/heads/$RUNTIME_BRANCH:$REMOTE_RUNTIME_SHA"
          else
            git push origin HEAD:"refs/heads/$RUNTIME_BRANCH"
          fi
          git push origin "${PACKAGE_NAME}@${TARGET_VERSION}"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create "${PACKAGE_NAME}@${TARGET_VERSION}" \
            "dist/releases/${PACKAGE_NAME}-${TARGET_VERSION}.tgz" \
            "dist/releases/${PACKAGE_NAME}-${TARGET_VERSION}.zip" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
